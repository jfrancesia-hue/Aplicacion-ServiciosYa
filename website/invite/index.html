<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Invitación a Servicios Ya</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #effcfb; color: #17363a; }
      main { width: min(88vw, 430px); padding: 32px; border-radius: 24px; background: white; box-shadow: 0 18px 50px #006b741c; text-align: center; }
      h1 { margin: 0 0 12px; }
      p { line-height: 1.5; color: #526b70; }
      a { display: block; margin-top: 24px; padding: 15px 20px; border-radius: 14px; color: white; background: #08aaa6; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Te invitaron a Servicios Ya</h1>
      <p>Abrí la app para crear tu cuenta con el código de invitación.</p>
      <a id="open-app" href="solucionesya://invite">Abrir Servicios Ya</a>
    </main>
    <script>
      const parts = location.pathname.split("/").filter(Boolean);
      const code = parts[1] || new URLSearchParams(location.search).get("referralCode") || "";
      document.querySelector("#open-app").href = code
        ? `solucionesya://invite/${encodeURIComponent(code)}`
        : "solucionesya://invite";
    </script>
  </body>
</html>
